name: Sync vendored upstream manifest metadata

on:
  push:
    paths:
      - .github/workflows/sync-vendored-upstream-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical SDK manifest without moving the pin
        run: |
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/enyst/openhands-agent/main/transpile/upstream.json \
            > /tmp/upstream.json

          current="$(node -p "require('./packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json').commit")"
          incoming="$(node -p "require('/tmp/upstream.json').commit")"
          if [ "$current" != "$incoming" ]; then
            echo "Refusing metadata-only sync across different pins: $current != $incoming" >&2
            exit 1
          fi

          cp /tmp/upstream.json packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/sync-vendored-upstream-manifest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/sync-vendored-upstream-manifest.yml \
            packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json
          if git diff --cached --quiet; then
            echo "Vendored upstream manifest metadata is already current."
            exit 0
          fi
          git commit -m "chore(agent-server): sync upstream manifest metadata"
          git pull --rebase origin main
          git push
