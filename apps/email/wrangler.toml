name = "smolpaws-email"
main = "src/index.ts"
compatibility_date = "2026-02-08"

[[routes]]
pattern = "email.liberty-labs.org"
custom_domain = true

[[queues.producers]]
queue = "smolpaws-email-queue"
binding = "EMAIL_QUEUE"

[[queues.consumers]]
queue = "smolpaws-email-queue"
max_batch_size = 1
max_batch_timeout = 5

# Worker secrets: RESEND_WEBHOOK_SECRET, RESEND_API_KEY (receiving access),
# EMAIL_ALLOWED_SENDERS, SMOLPAWS_RELAY_SERVER_URL, SMOLPAWS_RELAY_SERVER_API_KEY.
# Sending credentials and EMAIL_FROM_ADDRESS belong to the product host.
