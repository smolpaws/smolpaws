name: OpenHands Agent Server Examples

on:
  workflow_dispatch:

jobs:
  profile-driven-llm-workflow:
    runs-on: macos-latest
    timeout-minutes: 25
    environment: LLM
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install package dependencies
        run: npm ci --prefix packages/openhands-agent-server

      - name: Verify OpenAI API key is configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY must be configured in the LLM environment secrets." >&2
            exit 1
          fi

      - name: Run profile-driven OpenAI conversation workflow
        run: npm run manual:llm --prefix packages/openhands-agent-server
