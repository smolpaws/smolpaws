name: Install atomic OpenAPI refresh v2

on:
  push:
    paths:
      - .github/workflows/install-atomic-openapi-refresh-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write steady-state workflow literally
        run: |
          python - <<'PY'
          from pathlib import Path

          template = '''name: Refresh agent-server OpenAPI evidence

          on:
            workflow_dispatch:
            push:
              branches: [main]
              paths:
                - .github/workflows/refresh-agent-server-openapi.yml
                - packages/openhands-agent-server/src/**
                - packages/openhands-agent-server/scripts/check-openapi-operations.ts
                - packages/openhands-agent-server/scripts/generate-openapi.ts
                - packages/openhands-agent-server/scripts/generate-openapi-transport-report.ts
                - packages/openhands-agent-server/scripts/generate-openapi-schema-report.ts
                - packages/openhands-agent-server/scripts/project-openapi-operations.ts
                - packages/openhands-agent-server/scripts/project-openapi-schemas.ts
                - packages/openhands-agent-server/scripts/openapi-schema-projection.ts
                - packages/openhands-agent-server/transpile/openapi-policy.json
                - packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json

          permissions:
            contents: write

          concurrency:
            group: agent-server-openapi-evidence
            cancel-in-progress: true

          jobs:
            refresh:
              runs-on: ubuntu-latest
              timeout-minutes: 35

              steps:
                - name: Checkout SmolPaws
                  uses: actions/checkout@v4

                - name: Read canonical upstream pin
                  id: pin
                  run: |
                    pin="$(node -p "require('./packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json').commit")"
                    if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid canonical upstream pin: $pin" >&2
                      exit 1
                    fi
                    echo "sha=$pin" >> "$GITHUB_OUTPUT"

                - name: Checkout pinned OpenHands source
                  uses: actions/checkout@v4
                  with:
                    repository: OpenHands/software-agent-sdk
                    ref: @@ steps.pin.outputs.sha }}
                    fetch-depth: 1
                    path: .upstream-agent-sdk

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: packages/openhands-agent-server/package-lock.json

                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'

                - name: Install uv
                  run: python -m pip install --disable-pip-version-check uv

                - name: Install agent-server dependencies
                  run: npm ci --prefix packages/openhands-agent-server

                - name: Generate TypeScript OpenAPI
                  working-directory: packages/openhands-agent-server
                  run: npm run openapi

                - name: Generate pinned Python OpenAPI
                  working-directory: .upstream-agent-sdk
                  env:
                    SCHEMA_PATH: @@ github.workspace }}/python-openapi.raw.json
                  run: uv run --package openhands-agent-server python openhands-agent-server/openhands/agent_server/openapi.py

                - name: Generate all pinned parity artifacts
                  working-directory: packages/openhands-agent-server
                  run: |
                    mkdir -p transpile
                    npx tsx scripts/project-openapi-operations.ts \
                      --input "$GITHUB_WORKSPACE/python-openapi.raw.json" \
                      --output transpile/python-openapi.json \
                      --commit "@@ steps.pin.outputs.sha }}"
                    npx tsx scripts/project-openapi-schemas.ts \
                      --input "$GITHUB_WORKSPACE/python-openapi.raw.json" \
                      --output transpile/python-openapi-schema.json \
                      --commit "@@ steps.pin.outputs.sha }}"
                    npx tsx scripts/generate-openapi-transport-report.ts
                    npx tsx scripts/generate-openapi-schema-report.ts

                - name: Validate generated evidence
                  working-directory: packages/openhands-agent-server
                  run: |
                    npm run typecheck:scripts
                    npm run test:openapi-operations
                    npm run test:openapi-transport
                    npm run test:openapi-schema

                - name: Commit changed evidence atomically
                  run: |
                    artifacts=(
                      packages/openhands-agent-server/openapi.json
                      packages/openhands-agent-server/transpile/python-openapi.json
                      packages/openhands-agent-server/transpile/python-openapi-schema.json
                      packages/openhands-agent-server/transpile/openapi-transport-report.json
                      packages/openhands-agent-server/transpile/openapi-schema-report.json
                    )
                    git add "${artifacts[@]}"
                    if git diff --cached --quiet; then
                      echo "Agent-server OpenAPI evidence is already current."
                      exit 0
                    fi
                    git config user.name github-actions[bot]
                    git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                    git commit -m "chore(agent-server): refresh OpenAPI parity evidence"
                    git pull --rebase origin main
                    git push
          '''

          content = template.replace('@@', '${{')
          lines = content.splitlines()
          indent = min(
              len(line) - len(line.lstrip())
              for line in lines
              if line.strip()
          )
          content = '\n'.join(line[indent:] if line.strip() else '' for line in lines) + '\n'
          Path('.github/workflows/refresh-agent-server-openapi.yml').write_text(content)
          PY

          rm -f \
            .github/workflows/refresh-python-openapi.yml \
            .github/workflows/refresh-openapi-transport-report.yml \
            .github/workflows/refresh-openapi-schema-report.yml \
            .github/workflows/install-atomic-openapi-refresh.yml \
            .github/workflows/install-atomic-openapi-refresh-v2.yml

      - name: Commit workflow migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "Atomic OpenAPI refresh is already installed."
            exit 0
          fi
          git commit -m "ci(agent-server): repair atomic OpenAPI evidence refresh"
          git pull --rebase origin main
          git push
