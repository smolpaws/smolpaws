<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="20" height="20">
  <style>
    .pad { fill: #C0C0C0; stroke: #222; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .pad { fill: #E8E8E8; stroke: #FFF; }
    }
  </style>
  <!-- Main pad -->
  <ellipse cx="32" cy="40" rx="12" ry="10" class="pad"/>
  <!-- Top left toe -->
  <ellipse cx="18" cy="24" rx="6" ry="7" class="pad"/>
  <!-- Top center-left toe -->
  <ellipse cx="28" cy="18" rx="5.5" ry="7" class="pad"/>
  <!-- Top center-right toe -->
  <ellipse cx="38" cy="18" rx="5.5" ry="7" class="pad"/>
  <!-- Top right toe -->
  <ellipse cx="48" cy="24" rx="6" ry="7" class="pad"/>
</svg>
