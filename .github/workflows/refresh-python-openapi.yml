name: Refresh pinned Python OpenAPI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-python-openapi.yml'
      - 'packages/openhands-agent-server/scripts/canonicalize-python-openapi.ts'
      - 'packages/openhands-agent-server/scripts/refresh-python-openapi.sh'
      - 'packages/openhands-agent-server/scripts/run-pinned-python-openapi.py'
      - 'packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json'

permissions:
  contents: write

concurrency:
  group: refresh-python-openapi
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate OpenAPI from pinned Python source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SmolPaws
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: smolpaws

      - name: Read canonical upstream pin
        id: upstream
        working-directory: smolpaws
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile(
            'packages/openhands-agent-server/vendor/openhands-agent/transpile/upstream.json',
            'utf8',
          ));
          console.log(`repository=${manifest.repository}`);
          console.log(`commit=${manifest.commit}`);
          NODE

      - name: Checkout pinned OpenHands source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.commit }}
          fetch-depth: 1
          path: upstream
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smolpaws/packages/openhands-agent-server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: upstream/uv.lock

      - name: Install TypeScript tooling
        run: npm ci --prefix smolpaws/packages/openhands-agent-server

      - name: Generate canonical Python OpenAPI
        run: |
          chmod +x smolpaws/packages/openhands-agent-server/scripts/refresh-python-openapi.sh
          smolpaws/packages/openhands-agent-server/scripts/refresh-python-openapi.sh "$GITHUB_WORKSPACE/upstream"

      - name: Verify generated files
        working-directory: smolpaws
        run: |
          test -s packages/openhands-agent-server/transpile/python-openapi.json
          test -s packages/openhands-agent-server/transpile/python-openapi.meta.json
          git diff --check

      - name: Commit refreshed oracle when changed
        working-directory: smolpaws
        run: |
          paths=(
            packages/openhands-agent-server/transpile/python-openapi.json
            packages/openhands-agent-server/transpile/python-openapi.meta.json
          )

          if git diff --quiet -- "${paths[@]}"; then
            echo "Pinned Python OpenAPI is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore(agent-server): refresh pinned Python OpenAPI"
          git push
