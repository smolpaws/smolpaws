name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  slack-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Slack Relay launcher syntax
        run: bash -n scripts/run-local-slack-relay.sh

      - name: Install root dependencies
        run: npm ci

      - name: Install OpenHands agent-server package dependencies
        run: npm ci --prefix packages/openhands-agent-server

      - name: Build OpenHands agent-server for coordinator integration tests
        run: npm run build --prefix packages/openhands-agent-server

      - name: Run coordinator core and real-server integration tests
        run: npm run coordinator:test

      - name: Install Slack bridge dependencies
        run: npm ci --prefix apps/slack

      - name: Typecheck Slack coordinator bridge
        run: npm run typecheck --prefix apps/slack

      - name: Run Slack coordinator bridge tests
        run: npm run test --prefix apps/slack

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install agent-server dependencies
        run: npm ci --prefix apps/agent-server

      - name: Install OpenHands agent-server package dependencies
        run: npm ci --prefix packages/openhands-agent-server

      - name: Install GitHub ingress dependencies
        run: npm ci --prefix apps/github

      - name: Build OpenHands agent-server package for root typecheck
        run: npm run build --prefix packages/openhands-agent-server

      - name: Typecheck root
        run: npm run typecheck

      - name: Typecheck agent-server
        run: npm run typecheck --prefix apps/agent-server

      - name: Typecheck GitHub ingress
        run: npm run typecheck --prefix apps/github

      - name: Run agent-server runtime tests
        run: npm run agent-server:test

      - name: Run OpenHands agent-server package CI
        run: npm run ci --prefix packages/openhands-agent-server

      - name: Verify generated OpenAPI artifacts are committed
        run: |
          npm run openapi:generate
          git diff --exit-code -- packages/openhands-agent-server/openapi.json

      - name: Verify OpenAPI transport report is current
        working-directory: packages/openhands-agent-server
        run: npx tsx scripts/generate-openapi-transport-report.ts --check

      - name: Run GitHub ingress tests
        run: npm run github:test

      - name: Start agent-server and verify health
        run: |
          npm run runner:start > /tmp/smolpaws-runner.log 2>&1 &
          echo $! > /tmp/smolpaws-runner.pid

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8788/health >/tmp/smolpaws-runner-health.json; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:8788/health
          curl -fsS http://localhost:8788/ready

      - name: Print agent-server log on failure
        if: failure()
        run: |
          if [ -f /tmp/smolpaws-runner.log ]; then
            tail -n 200 /tmp/smolpaws-runner.log
          fi

      - name: Stop agent-server
        if: always()
        run: |
          if [ -f /tmp/smolpaws-runner.pid ]; then
            kill "$(cat /tmp/smolpaws-runner.pid)" || true
            wait "$(cat /tmp/smolpaws-runner.pid)" 2>/dev/null || true
          fi
